name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace
          cp app/build/outputs/apk/release/app-release.apk HueBeat.apk

      - uses: actions/upload-artifact@v4
        with:
          name: HueBeat-apk
          path: HueBeat.apk

      # Publishes the APK as a GitHub release so you can download it directly on your phone
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: HueBeat build ${{ github.run_number }}
          files: HueBeat.apk
          make_latest: true
