plugins {
    id 'com.android.application'
}

android {
    namespace 'app.huebeat'
    compileSdk 35

    defaultConfig {
        applicationId 'app.huebeat'
        minSdk 29          // Android 10: needed for capturing phone audio
        targetSdk 35
        versionCode 1
        versionName '1.0'
        ndk {
            abiFilters 'arm64-v8a' // phones from the last years; keeps the download small
        }
    }

    androidResources {
        noCompress 'tflite'
    }

    // A fixed key kept in the repo, so every cloud build can be installed as an update
    // over the previous one. (It only identifies this sideloaded app; it is not a secret.)
    signingConfigs {
        sideload {
            storeFile file('huebeat-release.jks')
            storePassword 'huebeat'
            keyAlias 'huebeat'
            keyPassword 'huebeat'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.sideload
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

dependencies {
    // TV detection in camera mode (object detector with a "tv" class)
    implementation 'com.google.mediapipe:tasks-vision:0.10.14'
}
