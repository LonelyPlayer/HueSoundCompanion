plugins {
    id 'com.android.application'
}

android {
    namespace 'app.huebeat'
    compileSdk 35

    defaultConfig {
        applicationId 'app.huebeat'
        minSdk 29          // Android 10: needed for capturing phone audio
        targetSdk 35
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        release {
            minifyEnabled false
            // signed with the debug key so it can be sideloaded without extra setup
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}
